<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAZE LAB - 迷路ゲーム & アルゴリズム可視化</title>
    <link rel="icon" href="ファビコン.png" type="image/png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js for procedural sound effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Google Fonts: Inter & JetBrains Mono & Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* カスタムフォント設定と基本スタイル */
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #090d16;
            color: #f8fafc;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .font-mono-num {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }

        /* キャンバスコンテナのレスポンシブ調整 */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 580px;
            max-height: 62vh;
            margin: 0 auto;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 1rem;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 25px rgba(56, 189, 248, 0.12);
            touch-action: none; /* スワイプ操作時のブラウザスクロールを無効化 */
        }

        /* ゲームボタンの立体的なスタイル */
        .btn-game {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
        }
        .btn-game:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
        }
        .btn-game:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        /* D-Pad ボタンのホバー＆アクティブエフェクト */
        .dpad-btn {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.08s ease, background 0.15s ease;
        }
        .dpad-btn:active {
            transform: scale(0.92);
            background: #38bdf8;
            color: #090d16;
            border-color: #7dd3fc;
        }

        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950">

    <!-- アプリケーションロジック -->
    <script>
        /**
         * MAZE LAB - 迷路生成・ゲームプレイ・A*最短経路探索ビジュアライザー
         */
        (() => {
            // --- DOM要素の取得 ---
            const canvas = document.getElementById('maze-canvas');
            const ctx = canvas.getContext('2d');
            const canvasWrapper = document.getElementById('canvas-wrapper');

            const timerDisplay = document.getElementById('timer-display');
            const stepsDisplay = document.getElementById('steps-display');
            const statusBadge = document.getElementById('status-badge');

            const difficultySelect = document.getElementById('difficulty-select');
            const modeSelect = document.getElementById('mode-select');
            const btnGenerate = document.getElementById('btn-generate');
            const btnSolve = document.getElementById('btn-solve');
            const btnReset = document.getElementById('btn-reset');
            const btnNextMaze = document.getElementById('btn-next-maze');
            const soundToggle = document.getElementById('sound-toggle');

            const victoryOverlay = document.getElementById('victory-overlay');
            const victorySubtitle = document.getElementById('victory-subtitle');
            const resTime = document.getElementById('res-time');
            const resSteps = document.getElementById('res-steps');
            const resOptimal = document.getElementById('res-optimal');

            // --- ゲーム状態管理 ---
            const CELL_WALL = 1;
            const CELL_PATH = 0;

            let gridSize = parseInt(difficultySelect.value, 10); // 必ず奇数
            let maze = [];
            let startPos = { x: 1, y: 1 };
            let goalPos = { x: gridSize - 2, y: gridSize - 2 };
            let playerPos = { x: 1, y: 1 };
            let renderPlayerPos = { x: 1, y: 1 }; // スムーズ補間用座標

            let playerTrail = [];     // プレイヤーが通った軌跡
            let exploredCells = [];   // A*探索が訪問したセル
            let solutionPath = [];    // 最短経路

            let isFogMode = false;
            let isSolved = false;
            let isAutoSolving = false;
            let solveAnimationId = null;

            // タイマー＆歩数
            let steps = 0;
            let startTime = null;
            let elapsedTime = 0;
            let timerInterval = null;

            // サウンド管理 (Tone.js)
            let soundEnabled = true;
            let synth = null;

            /**
             * Tone.js シンセサイザーの初期化（ユーザー操作時に安全に起動）
             */
            function initAudio() {
                if (!synth && typeof Tone !== 'undefined') {
                    try {
                        synth = new Tone.PolySynth(Tone.Synth, {
                            oscillator: { type: 'triangle' },
                            envelope: { attack: 0.005, decay: 0.1, sustain: 0.05, release: 0.2 }
                        }).toDestination();
                        synth.volume.value = -10;
                    } catch (e) {
                        console.warn('Audio initialization skipped:', e);
                    }
                }
            }

            function playSound(type) {
                if (!soundEnabled) return;
                initAudio();
                if (!synth) return;

                try {
                    if (Tone.context.state !== 'running') {
                        Tone.context.resume();
                    }
                    const now = Tone.now();
                    if (type === 'move') {
                        synth.triggerAttackRelease('C5', '32n', now);
                    } else if (type === 'wall') {
                        synth.triggerAttackRelease('G2', '32n', now);
                    } else if (type === 'generate') {
                        synth.triggerAttackRelease(['C4', 'E4', 'G4'], '16n', now);
                    } else if (type === 'win') {
                        synth.triggerAttackRelease('C5', '16n', now);
                        synth.triggerAttackRelease('E5', '16n', now + 0.08);
                        synth.triggerAttackRelease('G5', '16n', now + 0.16);
                        synth.triggerAttackRelease('C6', '4n', now + 0.24);
                    }
                } catch (e) {
                    // 音声再生エラーは無視してゲーム進行を妨げない
                }
            }

            // --- 迷路生成アルゴリズム (穴掘り法 / Recursive Backtracker) ---
            function generateMaze(size) {
                // 全て壁(1)で初期化
                const grid = Array.from({ length: size }, () => Array(size).fill(CELL_WALL));

                // 配列シャッフル関数
                function shuffle(array) {
                    for (let i = array.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [array[i], array[j]] = [array[j], array[i]];
                    }
                    return array;
                }

                // 再帰的穴掘り（スタック実装でスタックオーバーフロー防止）
                const stack = [{ x: 1, y: 1 }];
                grid[1][1] = CELL_PATH;

                const directions = [
                    { dx: 0, dy: -2 },
                    { dx: 2, dy: 0 },
                    { dx: 0, dy: 2 },
                    { dx: -2, dy: 0 }
                ];

                while (stack.length > 0) {
                    const current = stack[stack.length - 1];
                    const shuffledDirs = shuffle([...directions]);
                    let carved = false;

                    for (const dir of shuffledDirs) {
                        const nx = current.x + dir.dx;
                        const ny = current.y + dir.dy;

                        if (nx > 0 && nx < size - 1 && ny > 0 && ny < size - 1 && grid[ny][nx] === CELL_WALL) {
                            // 間の壁を壊す
                            grid[current.y + dir.dy / 2][current.x + dir.dx / 2] = CELL_PATH;
                            grid[ny][nx] = CELL_PATH;
                            stack.push({ x: nx, y: ny });
                            carved = true;
                            break;
                        }
                    }

                    if (!carved) {
                        stack.pop();
                    }
                }

                return grid;
            }

            // --- A* (A-Star) 最短経路探索アルゴリズム ---
            function computeAStar(start, goal) {
                const openSet = [{
                    x: start.x,
                    y: start.y,
                    g: 0,
                    f: Math.abs(goal.x - start.x) + Math.abs(goal.y - start.y),
                    parent: null
                }];
                const closedSet = new Set();
                const visitedOrder = [];

                const dirs = [
                    { dx: 0, dy: -1 },
                    { dx: 1, dy: 0 },
                    { dx: 0, dy: 1 },
                    { dx: -1, dy: 0 }
                ];

                while (openSet.length > 0) {
                    // f値が最小のノードを取得
                    openSet.sort((a, b) => a.f - b.f);
                    const current = openSet.shift();
                    const key = `${current.x},${current.y}`;

                    if (closedSet.has(key)) continue;
                    closedSet.add(key);
                    visitedOrder.push({ x: current.x, y: current.y });

                    // ゴール到達
                    if (current.x === goal.x && current.y === goal.y) {
                        const path = [];
                        let curr = current;
                        while (curr) {
                            path.unshift({ x: curr.x, y: curr.y });
                            curr = curr.parent;
                        }
                        return { visitedOrder, path };
                    }

                    for (const d of dirs) {
                        const nx = current.x + d.dx;
                        const ny = current.y + d.dy;
                        const nKey = `${nx},${ny}`;

                        if (
                            nx >= 0 && nx < gridSize &&
                            ny >= 0 && ny < gridSize &&
                            maze[ny][nx] === CELL_PATH &&
                            !closedSet.has(nKey)
                        ) {
                            const gScore = current.g + 1;
                            const hScore = Math.abs(goal.x - nx) + Math.abs(goal.y - ny);
                            openSet.push({
                                x: nx,
                                y: ny,
                                g: gScore,
                                f: gScore + hScore,
                                parent: current
                            });
                        }
                    }
                }
                return { visitedOrder, path: [] };
            }

            // --- タイマー制御 ---
            function startTimer() {
                if (timerInterval) return;
                startTime = Date.now() - elapsedTime;
                timerInterval = setInterval(() => {
                    elapsedTime = Date.now() - startTime;
                    timerDisplay.textContent = formatTime(elapsedTime);
                }, 50);
            }

            function stopTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }

            function resetTimer() {
                stopTimer();
                elapsedTime = 0;
                startTime = null;
                timerDisplay.textContent = '00:00.0';
            }

            function formatTime(ms) {
                const totalSeconds = ms / 1000;
                const mins = Math.floor(totalSeconds / 60);
                const secs = Math.floor(totalSeconds % 60);
                const tenths = Math.floor((ms % 1000) / 100);
                return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${tenths}`;
            }

            // --- ゲーム初期化 & リセット ---
            function initNewGame() {
                cancelAutoSolve();
                victoryOverlay.classList.add('hidden');

                gridSize = parseInt(difficultySelect.value, 10);
                isFogMode = modeSelect.value === 'fog';
                maze = generateMaze(gridSize);

                startPos = { x: 1, y: 1 };
                goalPos = { x: gridSize - 2, y: gridSize - 2 };

                resetPlayerState();
                playSound('generate');
            }

            function resetPlayerState() {
                cancelAutoSolve();
                victoryOverlay.classList.add('hidden');

                playerPos = { ...startPos };
                renderPlayerPos = { ...startPos };
                playerTrail = [{ ...startPos }];
                exploredCells = [];
                solutionPath = [];
                isSolved = false;
                steps = 0;
                stepsDisplay.textContent = '0';

                resetTimer();
                updateStatusBadge('プレイ中', 'sky');
                btnSolve.disabled = false;
            }

            function updateStatusBadge(text, color) {
                statusBadge.textContent = text;
                statusBadge.className = 'text-[11px] font-semibold px-2.5 py-0.5 rounded-full border ';
                if (color === 'sky') {
                    statusBadge.className += 'bg-sky-500/15 text-sky-400 border-sky-500/30';
                } else if (color === 'amber') {
                    statusBadge.className += 'bg-amber-500/15 text-amber-400 border-amber-500/30';
                } else if (color === 'emerald') {
                    statusBadge.className += 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30';
                }
            }

            // --- プレイヤー移動処理 ---
            function movePlayer(dx, dy) {
                if (isSolved || isAutoSolving) return;

                const nx = playerPos.x + dx;
                const ny = playerPos.y + dy;

                // 壁・範囲外判定
                if (nx < 0 || nx >= gridSize || ny < 0 || ny >= gridSize || maze[ny][nx] === CELL_WALL) {
                    playSound('wall');
                    return;
                }

                // 初回移動時にタイマースタート
                if (steps === 0 && !timerInterval) {
                    startTimer();
                }

                playerPos = { x: nx, y: ny };
                steps++;
                stepsDisplay.textContent = steps;
                playSound('move');

                // 軌跡の更新（1つ前のマスに戻る場合は軌跡を縮める）
                if (playerTrail.length >= 2) {
                    const prev = playerTrail[playerTrail.length - 2];
                    if (prev.x === nx && prev.y === ny) {
                        playerTrail.pop();
                    } else {
                        playerTrail.push({ x: nx, y: ny });
                    }
                } else {
                    playerTrail.push({ x: nx, y: ny });
                }

                // ゴール判定
                if (nx === goalPos.x && ny === goalPos.y) {
                    handleGoalReached(false);
                }
            }

            // --- ゴール到達時の処理 ---
            function handleGoalReached(byAI) {
                isSolved = true;
                stopTimer();
                btnSolve.disabled = true;

                // 最短経路を計算して比較表示
                const { path } = computeAStar(startPos, goalPos);
                solutionPath = path;
                const optimalSteps = Math.max(0, path.length - 1);

                resTime.textContent = formatTime(elapsedTime);
                resSteps.textContent = byAI ? `${optimalSteps} (AI)` : steps;
                resOptimal.textContent = optimalSteps;

                if (byAI) {
                    victorySubtitle.textContent = 'A*アルゴリズムが最短経路を発見しました！';
                    updateStatusBadge('AI探索完了', 'amber');
                } else {
                    const isPerfect = steps === optimalSteps;
                    victorySubtitle.textContent = isPerfect
                        ? 'パーフェクト！最短歩数でのクリアです！'
                        : 'おめでとうございます！迷路をクリアしました！';
                    updateStatusBadge('クリア！', 'emerald');
                    playSound('win');
                }

                setTimeout(() => {
                    victoryOverlay.classList.remove('hidden');
                }, 350);
            }

            // --- AI自動探索アニメーション ---
            function startAutoSolve() {
                if (isAutoSolving || isSolved) return;

                isAutoSolving = true;
                btnSolve.disabled = true;
                stopTimer();
                updateStatusBadge('A* 探索中...', 'amber');

                // 現在位置からゴールまでの最短経路をA*で計算
                const { visitedOrder, path } = computeAStar(playerPos, goalPos);
                exploredCells = [];
                solutionPath = [];

                let visitIdx = 0;
                // 迷路サイズに応じてアニメーション速度を調整
                const batchSize = Math.max(1, Math.floor(gridSize / 8));

                function stepExplore() {
                    if (!isAutoSolving) return;

                    if (visitIdx < visitedOrder.length) {
                        for (let i = 0; i < batchSize && visitIdx < visitedOrder.length; i++) {
                            exploredCells.push(visitedOrder[visitIdx++]);
                        }
                        solveAnimationId = requestAnimationFrame(stepExplore);
                    } else {
                        // 探索完了後、最短経路を順番に描画
                        let pathIdx = 0;
                        function stepPath() {
                            if (!isAutoSolving) return;
                            if (pathIdx < path.length) {
                                solutionPath.push(path[pathIdx]);
                                playerPos = { ...path[pathIdx] };
                                pathIdx++;
                                solveAnimationId = requestAnimationFrame(stepPath);
                            } else {
                                isAutoSolving = false;
                                handleGoalReached(true);
                            }
                        }
                        solveAnimationId = requestAnimationFrame(stepPath);
                    }
                }

                solveAnimationId = requestAnimationFrame(stepExplore);
            }

            function cancelAutoSolve() {
                isAutoSolving = false;
                if (solveAnimationId) {
                    cancelAnimationFrame(solveAnimationId);
                    solveAnimationId = null;
                }
            }

            // --- キャンバス描画処理 ---
            function resizeCanvas() {
                const rect = canvasWrapper.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            function render() {
                const width = canvasWrapper.clientWidth;
                const height = canvasWrapper.clientHeight;
                const cellSize = width / gridSize;

                // プレイヤー描画位置のスムーズ補間 (Lerp)
                renderPlayerPos.x += (playerPos.x - renderPlayerPos.x) * 0.35;
                renderPlayerPos.y += (playerPos.y - renderPlayerPos.y) * 0.35;

                // 背景クリア (通路の色)
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, width, height);

                // 1. AI探索済みセルの描画
                if (exploredCells.length > 0) {
                    ctx.fillStyle = 'rgba(99, 102, 241, 0.25)';
                    for (const cell of exploredCells) {
                        ctx.fillRect(
                            cell.x * cellSize + 0.5,
                            cell.y * cellSize + 0.5,
                            cellSize - 1,
                            cellSize - 1
                        );
                    }
                }

                // 2. プレイヤーの移動軌跡 (ライン描画)
                if (playerTrail.length > 1) {
                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
                    ctx.lineWidth = Math.max(2, cellSize * 0.28);
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    playerTrail.forEach((pt, idx) => {
                        const cx = (pt.x + 0.5) * cellSize;
                        const cy = (pt.y + 0.5) * cellSize;
                        if (idx === 0) ctx.moveTo(cx, cy);
                        else ctx.lineTo(cx, cy);
                    });
                    ctx.stroke();
                }

                // 3. 最短経路のハイライト描画
                if (solutionPath.length > 1) {
                    ctx.beginPath();
                    ctx.strokeStyle = '#fbbf24';
                    ctx.lineWidth = Math.max(2.5, cellSize * 0.34);
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    solutionPath.forEach((pt, idx) => {
                        const cx = (pt.x + 0.5) * cellSize;
                        const cy = (pt.y + 0.5) * cellSize;
                        if (idx === 0) ctx.moveTo(cx, cy);
                        else ctx.lineTo(cx, cy);
                    });
                    ctx.stroke();
                }

                // 4. 壁の描画
                ctx.fillStyle = '#1e293b';
                for (let y = 0; y < gridSize; y++) {
                    for (let x = 0; x < gridSize; x++) {
                        if (maze[y][x] === CELL_WALL) {
                            ctx.fillRect(
                                x * cellSize,
                                y * cellSize,
                                cellSize + 0.4,
                                cellSize + 0.4
                            );
                        }
                    }
                }

                // 5. スタート地点マーカー
                const startPad = cellSize * 0.22;
                ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
                ctx.beginPath();
                ctx.roundRect(
                    startPos.x * cellSize + startPad,
                    startPos.y * cellSize + startPad,
                    cellSize - startPad * 2,
                    cellSize - startPad * 2,
                    cellSize * 0.2
                );
                ctx.fill();

                // 6. ゴール地点マーカー (パルス発光)
                const pulse = Math.sin(Date.now() / 220) * 0.08 + 0.92;
                const goalPad = cellSize * 0.16;
                const gSize = (cellSize - goalPad * 2) * pulse;
                const gOffset = (cellSize - gSize) / 2;

                ctx.save();
                ctx.shadowColor = '#f43f5e';
                ctx.shadowBlur = 12;
                ctx.fillStyle = '#f43f5e';
                ctx.beginPath();
                ctx.roundRect(
                    goalPos.x * cellSize + gOffset,
                    goalPos.y * cellSize + gOffset,
                    gSize,
                    gSize,
                    cellSize * 0.25
                );
                ctx.fill();
                ctx.restore();

                // 7. プレイヤーの描画
                const px = (renderPlayerPos.x + 0.5) * cellSize;
                const py = (renderPlayerPos.y + 0.5) * cellSize;
                const radius = cellSize * 0.34;

                ctx.save();
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 14;
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(px, py, radius, 0, Math.PI * 2);
                ctx.fill();

                // プレイヤー中心のハイライト
                ctx.fillStyle = '#e0f2fe';
                ctx.beginPath();
                ctx.arc(px - radius * 0.22, py - radius * 0.22, radius * 0.32, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // 8. 暗闇モード (Fog of War) の適用
                if (isFogMode && !isSolved && !isAutoSolving) {
                    const visionRadius = cellSize * 3.6;
                    const grad = ctx.createRadialGradient(px, py, cellSize * 1.1, px, py, visionRadius);
                    grad.addColorStop(0, 'rgba(9, 13, 22, 0)');
                    grad.addColorStop(0.7, 'rgba(9, 13, 22, 0.88)');
                    grad.addColorStop(1, 'rgba(9, 13, 22, 0.98)');

                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, width, height);
                }

                requestAnimationFrame(render);
            }

            // --- イベントリスナー設定 ---

            // キーボード操作 (矢印キー & WASD)
            window.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'].includes(key)) {
                    e.preventDefault();
                }
                if (key === 'arrowup' || key === 'w') movePlayer(0, -1);
                else if (key === 'arrowdown' || key === 's') movePlayer(0, 1);
                else if (key === 'arrowleft' || key === 'a') movePlayer(-1, 0);
                else if (key === 'arrowright' || key === 'd') movePlayer(1, 0);
            });

            // 画面上のD-Padボタン (タップ＆クリック対応)
            const bindDpad = (id, dx, dy) => {
                const btn = document.getElementById(id);
                btn.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    movePlayer(dx, dy);
                });
            };
            bindDpad('dpad-up', 0, -1);
            bindDpad('dpad-down', 0, 1);
            bindDpad('dpad-left', -1, 0);
            bindDpad('dpad-right', 1, 0);

            // キャンバス上のスワイプ操作
            let touchStartX = 0;
            let touchStartY = 0;
            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }
            }, { passive: true });

            canvas.addEventListener('touchend', (e) => {
                if (e.changedTouches.length === 1) {
                    const dx = e.changedTouches[0].clientX - touchStartX;
                    const dy = e.changedTouches[0].clientY - touchStartY;
                    const absX = Math.abs(dx);
                    const absY = Math.abs(dy);

                    if (Math.max(absX, absY) > 22) {
                        if (absX > absY) {
                            movePlayer(dx > 0 ? 1 : -1, 0);
                        } else {
                            movePlayer(0, dy > 0 ? 1 : -1);
                        }
                    }
                }
            }, { passive: true });

            // コントロールボタン
            btnGenerate.addEventListener('click', initNewGame);
            btnNextMaze.addEventListener('click', initNewGame);
            btnReset.addEventListener('click', resetPlayerState);
            btnSolve.addEventListener('click', startAutoSolve);

            difficultySelect.addEventListener('change', initNewGame);
            modeSelect.addEventListener('change', () => {
                isFogMode = modeSelect.value === 'fog';
            });

            // サウンド切り替え
            soundToggle.addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                document.getElementById('icon-sound-on').classList.toggle('hidden', !soundEnabled);
                document.getElementById('icon-sound-off').classList.toggle('hidden', soundEnabled);
                if (soundEnabled) initAudio();
            });

            // ウィンドウリサイズ対応
            window.addEventListener('resize', resizeCanvas);

            // 初期化実行
            window.onload = () => {
                resizeCanvas();
                initNewGame();
                requestAnimationFrame(render);
            };
        })();
    </script>
</body>
</html>
