<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>記録つき自動生成迷路ゲーム</title>
<link rel="icon" href="アイコン.png" type="image/png">
<style>
  body {
    text-align: center;
    font-family: sans-serif;
    background-color: #f0f0f0;
  }
  .status-board {
    display: flex;
    justify-content: center;
    gap: 20px;
    background-color: #fff;
    padding: 12px 24px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    max-width: 450px;
    margin: 10px auto;
    font-size: 18px;
    font-weight: bold;
  }
  .status-item span {
    color: #e74c3c;
    font-size: 22px;
  }
  canvas {
    background-color: #ffffff;
    border: 4px solid #333;
    margin-top: 10px;
    display: block;
    margin-left: auto;
    margin-right: auto;
  }
  .controls {
    margin-top: 15px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    background-color: #3498db;
    color: white;
    border: none;
    border-radius: 5px;
  }
  button:hover {
    background-color: #2980b9;
  }
  button.reset-btn {
    background-color: #95a5a6;
  }
  button.reset-btn:hover {
    background-color: #7f8c8d;
  }
</style>
</head>
<body>

<h1>自動生成迷路ゲーム</h1>

<div class="status-board">
  <div class="status-item">第 <span id="stageDisplay">1</span> 問</div>
  <div class="status-item">今回: <span id="currentScoreDisplay">0</span> 点</div>
  <div class="status-item">最高: <span id="highScoreDisplay">0</span> 点</div>
</div>

<canvas id="gameCanvas" width="450" height="450"></canvas>

<div class="controls">
  <button onclick="skipMaze()">別の迷路にする</button>
  <button class="reset-btn" onclick="resetAll()">記録をリセット</button>
</div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  const cols = 15;
  const rows = 15;
  const tileSize = canvas.width / cols;

  let map = [];
  let player = { x: 1, y: 1 };

  // スコアとステージの管理変数
  let stageCount = 1;
  let currentScore = 0;
  let highScore = localStorage.getItem("mazeHighScore") ? parseInt(localStorage.getItem("mazeHighScore")) : 0;
  let startTime = 0;

  // 画面上の数値表示を更新する関数
  function updateBoard() {
    document.getElementById("stageDisplay").textContent = stageCount;
    document.getElementById("currentScoreDisplay").textContent = currentScore;
    document.getElementById("highScoreDisplay").textContent = highScore;
  }

  // 迷路を自動生成する関数（穴掘り法）
  function generateMaze() {
    map = Array.from({ length: rows }, () => Array(cols).fill(1));

    function dig(x, y) {
      map[y][x] = 0;
      const directions = [
        { dx: 0, dy: -2 },
        { dx: 0, dy: 2 },
        { dx: -2, dy: 0 },
        { dx: 2, dy: 0 }
      ].sort(() => Math.random() - 0.5);

      for (let dir of directions) {
        const nx = x + dir.dx;
        const ny = y + dir.dy;

        if (nx > 0 && nx < cols - 1 && ny > 0 && ny < rows - 1 && map[ny][nx] === 1) {
          map[y + dir.dy / 2][x + dir.dx / 2] = 0;
          dig(nx, ny);
        }
      }
    }

    dig(1, 1);
    map[rows - 2][cols - 2] = 2; // ゴール
  }

  // ステージの開始処理
  function startStage() {
    player = { x: 1, y: 1 };
    generateMaze();
    updateBoard();
    draw();
    startTime = Date.now(); // スタート時間を記録
  }

  // 別の迷路に変える（ステージ数やスコアは維持）
  function skipMaze() {
    startStage();
  }

  // 最初からやり直す（最高得点は残し、今回分をリセット）
  function resetAll() {
    if (confirm("現在の進行状況（第1問から・今回スコア0点）をリセットしますか？\n※最高得点は残ります。")) {
      stageCount = 1;
      currentScore = 0;
      startStage();
    }
  }

  // 画面を描画する処理
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        if (map[y][x] === 1) {
          ctx.fillStyle = "#333";
          ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
        } else if (map[y][x] === 2) {
          ctx.fillStyle = "#2ecc71";
          ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
        }
      }
    }

    ctx.fillStyle = "#e74c3c";
    ctx.beginPath();
    ctx.arc(
      player.x * tileSize + tileSize / 2,
      player.y * tileSize + tileSize / 2,
      tileSize / 3,
      0,
      Math.PI * 2
    );
    ctx.fill();
  }

  // キーボード操作の処理
  document.addEventListener("keydown", function(e) {
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
      e.preventDefault();
    }

    let nextX = player.x;
    let nextY = player.y;

    if (e.key === "ArrowUp") nextY--;
    if (e.key === "ArrowDown") nextY++;
    if (e.key === "ArrowLeft") nextX--;
    if (e.key === "ArrowRight") nextX++;

    if (map[nextY] && map[nextY][nextX] !== 1) {
      player.x = nextX;
      player.y = nextY;
      draw();

      // ゴール(2)に到達したか判定
      if (map[player.y][player.x] === 2) {
        // クリア時間（秒）を計算してスコアを算出
        const elapsedSeconds = (Date.now() - startTime) / 1000;
        // 基本点100点 ＋ 早くクリアするほどボーナス（30秒以内なら最大300点追加）
        const timeBonus = Math.max(0, Math.floor((30 - elapsedSeconds) * 10));
        const earnedScore = 100 + timeBonus;

        currentScore += earnedScore;

        // 最高得点の更新チェック
        let isNewRecord = false;
        if (currentScore > highScore) {
          highScore = currentScore;
          localStorage.setItem("mazeHighScore", highScore);
          isNewRecord = true;
        }

        updateBoard();

        setTimeout(() => {
          let message = `第 ${stageCount} 問クリア！（タイム: ${elapsedSeconds.toFixed(1)}秒）\n獲得スコア: +${earnedScore} 点`;
          if (isNewRecord) {
            message += "\n★ 最高得点を更新しました！ ★";
          }
          alert(message);

          stageCount++; // 次の迷路へカウントアップ
          startStage();
        }, 50);
      }
    }
  });

  // 初回スタート
  startStage();
</script>

</body>
</html>
